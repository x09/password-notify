# password-notify configuration
# Configuration file for domain password expiration notification

[general]
# Number of days before password expiration to start showing notifications
# Уведомление начнет показываться за N дней до истечения пароля
warn_days = 7

# Check interval in hours (default: 24 hours = once per day)
# Интервал проверки в часах (по умолчанию раз в сутки)
check_interval_hours = 24

[ldap]
# LDAP server URI (leave empty for auto-discovery via DNS SRV records)
# URI LDAP сервера (оставить пустым для автообнаружения через DNS SRV)
server_uri =

# Base DN for user search (leave empty for auto-detection from Kerberos realm)
# Base DN для поиска пользователя (оставить пустым для определения из Kerberos realm)
base_dn =

# Auto-discovery: no = LDAP with GSSAPI encryption; yes = LDAPS with TLS.
# Схема явного server_uri имеет приоритет над use_ldaps.
use_ldaps = no

# Disable LDAPS certificate chain and hostname validation (GSSAPI remains enabled).
# Отключить проверку сертификата LDAPS. По умолчанию false.
skip-issuer = false

[password_change]
# Password change: samba = Kerberos; passwd = /usr/bin/passwd via system PAM.
# method = passwd запускает passwd напрямую, без предварительного Kerberos-запроса.
method = samba

[ui]
# Show notification even if AppIndicator is working
# Показывать всплывающие уведомления даже если трей работает
always_notify = yes

# Notification urgency: low, normal, critical
# Срочность уведомлений
notification_urgency = normal